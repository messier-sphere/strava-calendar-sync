name: Sync Strava events

# Regenerates strava-events.ics every morning. The daily commit counts as
# repo activity, which keeps GitHub from auto-disabling the schedule.
on:
  schedule:
    - cron: "15 14 * * *"   # 7:15 AM PT daily
  workflow_dispatch:          # manual "Run workflow" button also works

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch events and rebuild the feed
        run: python3 sync.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLUB_IDS: ${{ secrets.STRAVA_CLUB_IDS }}

      - name: Commit updated feed
        run: |
          git config user.name "strava-sync"
          git config user.email "strava-sync@users.noreply.github.com"
          git add strava-events.ics
          git diff --cached --quiet || git commit -m "Update Strava events feed"
          git push
